<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="extensionName"></title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="title" data-i18n="popup_title"></span>
  </header>

  <div id="login-required" class="notice" hidden>
    <p data-i18n="popup_login_required"></p>
    <a href="#" id="open-linkedin" data-i18n="popup_login_link"></a>
  </div>

  <div id="status" class="status">
    <div class="count"><span id="count">–</span></div>
    <div class="count-label" data-i18n="popup_blocked_label"></div>
  </div>

  <label id="show-all-row" class="switch">
    <input type="checkbox" id="show-all">
    <span data-i18n="popup_show_all"></span>
  </label>

  <div id="warn" class="warn" hidden data-i18n="popup_warn_selectors"></div>

  <div class="actions">
    <a href="#" id="open-options" data-i18n="popup_open_options"></a>
  </div>

  <script src="../src/i18n.js"></script>
  <script src="../src/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
